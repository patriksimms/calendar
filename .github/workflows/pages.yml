name: Deploy Examples to GitHub Pages

on:
  push:
    branches:
      - 10.x
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install package dependencies
        run: bun install --frozen-lockfile

      - name: Install examples dependencies
        working-directory: examples
        run: bun install --frozen-lockfile

      - name: Collect Pages metadata
        run: |
          package_version=$(bun -p "require('./package.json').version")
          short_sha=$(git rev-parse --short HEAD)
          echo "VITE_PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "VITE_SHORT_SHA=$short_sha" >> "$GITHUB_ENV"

      - name: Build examples
        working-directory: examples
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_REF_NAME: ${{ github.ref_name }}
          VITE_REPOSITORY: ${{ github.repository }}
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
